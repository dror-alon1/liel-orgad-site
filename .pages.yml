# Pages CMS configuration for lielorgad.com
# Liel edits content here; scripts/build.mjs turns content/ + templates/ into the site on every save.
# Generated from the page templates. Field names (s02, f03...) map to placeholders in templates/*.html: do not rename them.
media:
  input: public/images
  output: /images
  extensions: [jpg, jpeg, png, webp]
content:
  - name: blog
    label: "בלוג: מאמרים"
    type: collection
    path: content/blog
    format: json
    filename: "{year}-{month}-{day}-{fields.slug}.json"
    fields:
      - name: title
        label: "כותרת המאמר"
        type: string
        required: true
      - name: slug
        label: "כתובת המאמר באנגלית, למשל first-apartment-checklist"
        type: string
        required: true
      - name: date
        label: "תאריך פרסום"
        type: date
        required: true
      - name: description
        label: "תקציר קצר (מוצג ברשימת המאמרים ובגוגל)"
        type: text
      - name: cover
        label: "תמונה ראשית"
        type: image
      - name: cover_alt
        label: "תיאור התמונה (לנגישות ולגוגל)"
        type: string
      - name: body
        label: "תוכן המאמר"
        type: rich-text
        required: true
        options:
          format: html
      - name: draft
        label: "טיוטה: לא להציג באתר עדיין"
        type: boolean
